name: Run Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python on the cloud server
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # You can change this to 3.10, 3.12, etc.
          cache: 'pip'           # Speeds up future runs by caching downloads

      # Step 3: Install your project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest # Ensures pytest is installed to run the tests

      # Step 4: Run your Python tests
      - name: Run test suite with pytest
        run: pytest
